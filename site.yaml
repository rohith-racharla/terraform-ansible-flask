---
############################
# PLAY 1: HAProxy Setup
############################
- name: Install and configure HAProxy
  hosts: haproxy
  become: yes

  tasks:
    - name: Install HAProxy
      apt:
        name: haproxy
        state: present
        update_cache: yes

    - name: Deploy HAProxy configuration
      template:
        src: haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
        owner: root
        group: root
        mode: '0644'
      notify: Restart HAProxy

  handlers:
    - name: Restart HAProxy
      service:
        name: haproxy
        state: restarted


############################
# PLAY 2: Web Servers Setup
############################
- name: Install and configure Flask application
  hosts: webservers
  become: yes

  vars:
    app_user: ubuntu
    app_dir: /home/ubuntu/flaskapp
    venv_dir: /home/ubuntu/flaskapp/venv

  tasks:
    - name: Update package cache
      apt:
        update_cache: yes

    - name: Install system dependencies
      apt:
        name:
          - python3
          - python3-pip
          - python3-venv
          - gunicorn
        state: present

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        mode: '0755'

    - name: Copy Flask application
      copy:
        src: app.py
        dest: "{{ app_dir }}/app.py"
        owner: "{{ app_user }}"
        mode: '0644'

    - name: Create Python virtual environment
      command: python3 -m venv "{{ venv_dir }}"
      args:
        creates: "{{ venv_dir }}/bin/activate"

    - name: Install Flask inside virtualenv
      pip:
        name: flask
        virtualenv: "{{ venv_dir }}"

    - name: Create Gunicorn systemd service
      copy:
        dest: /etc/systemd/system/gunicorn.service
        content: |
          [Unit]
          Description=Gunicorn Flask App
          After=network.target

          [Service]
          User={{ app_user }}
          WorkingDirectory={{ app_dir }}
          ExecStart={{ venv_dir }}/bin/gunicorn \
            --workers 2 \
            --bind 0.0.0.0:5000 \
            app:app

          [Install]
          WantedBy=multi-user.target
      notify:
        - Reload systemd
        - Restart Gunicorn

  handlers:
    - name: Reload systemd
      command: systemctl daemon-reexec

    - name: Restart Gunicorn
      service:
        name: gunicorn
        state: restarted
        enabled: yes


############################
# PLAY 3: Reload HAProxy
############################
- name: Reload HAProxy after backend changes
  hosts: haproxy
  become: yes

  tasks:
    - name: Restart HAProxy
      service:
        name: haproxy
        state: restarted
